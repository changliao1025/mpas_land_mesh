# ==============================================================================
# Tier 1 Specification: Yellow River (Huanghe) Basin MPAS Mesh Workflow
#
# A single sectioned YAML configuration file serving as the primary source of truth.
# Drives regional variable-resolution MPAS mesh generation refining the Yellow River
# basin corridor, regional tributaries, lakes, and watershed boundaries.
# ==============================================================================

# High-level workflow orchestration and execution targets
workflow:
  date: "20261101"                                # Run date (YYYYMMDD)
  mesh_type: mpas                                 # Target mesh family (MPAS / JIGSAW)
  case_index: 2                                   # Case index number
  model: jigsaw                                   # Core mesh generation backend
  process_river_network: true        # Optional line simplification for rivers
  process_coastline: true                        # Coastline masking and buffering
  process_watershed_boundary: true                  # Optional processing for watershed boundaries
  debug: true                                     # Enable diagnostic logging
  largest_outlets: 1                            # Retain top N largest basin outlets
  run_on_hpc: false                               # Set true to generate SLURM batch job scripts

# Multi-scale target cell resolutions (in kilometers)
resolutions:
  ocean_km: 100                                   # Coarse open ocean resolution (100 km)
  land_km: 8.0                                   # Background land resolution (12.5 km)
  river_network_km: 3                             # River network corridor refinement (5 km)
  coastline_km: 3                                # Near-shore transition resolution (10 km)
  lake_boundary_km: 3                             # Lake perimeter refinement (3 km)
  watershed_boundary_km: 3                        # Watershed divide refinement (3 km)

